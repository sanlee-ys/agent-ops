      <text class="t t-sm" x="10" y="21">decisions/</text>
      <text class="t t-xxs t-dim" x="10" y="39">ADRs · fleet routing</text>
    </g>
    <text class="t t-xxs t-accent" x="14" y="214">WIRES THE FENCE</text>
  </g>

