<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" role="img" aria-labelledby="title desc">
  <title id="title">agent-ops and telltale as sibling repos around the fleet</title>
  <desc id="desc">
    Two sibling repos sit under human-set DCB. agent-ops is the operating
    layer: vendor adapters, hooks, security, incidents, conventions, and
    decisions. It wires the mechanical fence. telltale is the observer:
    council, HUD, and statusline. It never routes. Fleet seats are Claude
    (control plane), Codex, Antigravity, and Pi, plus Grok Build as
    guard-wired only. Cursor is not a seat. A fleet bus joins the repos
    to the seats. PreToolUse and ConfigChange guards bind every seat.
  </desc>
  <defs>
    <style>
      .bg { fill: #dce3e8; }
      .panel { fill: #f3f6f8; stroke: #9aa7b2; stroke-width: 1; }
      .grid-line { stroke: #b7c2cc; stroke-width: 0.6; fill: none; opacity: 0.55; }
      .hatch-line { stroke: #8a6c14; stroke-width: 0.7; opacity: 0.22; }
      .inset { fill: #ffffff; stroke: #b7c2cc; stroke-width: 1; }
      .rule { stroke: #b7c2cc; stroke-width: 1; fill: none; }
      .accent { stroke: #1f6b65; stroke-width: 1.35; fill: none; }
      .accent-fill { fill: #1f6b65; }
      .amber { fill: #8a6c14; }
      .observe { stroke: #8a6c14; stroke-width: 1.35; fill: none; stroke-dasharray: 3.5 2.5; }
      .wire { stroke: #1f6b65; stroke-width: 1.6; fill: none; }
      .seat { fill: #ffffff; stroke: #a8b4be; stroke-width: 1; }
      .seat-ctrl { fill: #e4f1ef; stroke: #1f6b65; stroke-width: 1.45; }
      .seat-wire { fill: #eef1f4; stroke: #7a8794; stroke-width: 1; stroke-dasharray: 3 2; }
      .repo { fill: #ffffff; stroke: #1f6b65; stroke-width: 1.45; }
      .repo-obs { fill: #fbf6e8; stroke: #8a6c14; stroke-width: 1.45; }
      .tab { fill: #dcecea; stroke: #1f6b65; stroke-width: 1.45; }
      .tab-obs { fill: #f3e6bc; stroke: #8a6c14; stroke-width: 1.45; }
      .cell { fill: #eef2f5; stroke: #c5ced6; stroke-width: 1; }
      .cell-obs { fill: #fff8e4; stroke: #d9c37a; stroke-width: 1; }
      .fence { fill: #e6ebef; stroke: #9aa7b2; stroke-width: 1; }
      .guard { fill: #ffffff; stroke: #9aa7b2; stroke-width: 1; }
      .bus { fill: #c5ced6; stroke: #7a8794; stroke-width: 1; }
      .pin { fill: #7a8794; }
      .pin-ctrl { fill: #1f6b65; }
      .pin-obs { fill: #8a6c14; }
      .screw { fill: #c5ced6; stroke: #7a8794; stroke-width: 0.75; }
      .t { font-family: "JetBrains Mono", "Cascadia Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #141b22; }
      .t-dim { fill: #44525e; }
      .t-accent { fill: #1f6b65; }
      .t-amber { fill: #8a6c14; }
      .t-sm { font-size: 11px; }
      .t-xs { font-size: 10px; }
      .t-xxs { font-size: 9px; }
      .t-md { font-size: 13px; }
      .t-lg { font-size: 15px; letter-spacing: 0.06em; }
      .t-xl { font-size: 13px; letter-spacing: 0.16em; }
      .tick { stroke: #9aa7b2; stroke-width: 1; }
    </style>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path class="grid-line" d="M16 0 H0 V16"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line class="hatch-line" x1="0" y1="0" x2="0" y2="7"/>
    </pattern>
  </defs>

